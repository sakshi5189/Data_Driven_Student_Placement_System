<!DOCTYPE html>
<html>
<head>
  <title>Placement System</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    .gradient {
      background: linear-gradient(90deg,#4e54c8,#8f94fb);
    }
    .card-hover:hover { transform: translateY(-3px); box-shadow: 0 10px 20px rgba(0,0,0,.08); }
    .badge-dot { width:10px; height:10px; border-radius:50%; display:inline-block; margin-right:6px; }
  </style>
</head>
<body class="bg-light">

<nav class="navbar gradient navbar-dark px-3">
  <span class="navbar-brand">🎓 Placement System</span>
  <div>
    {% if session.get('user') %}
      <span class="text-white me-3">Hi, {{ session.get('user') }}</span>
      <a href="/logout" class="btn btn-light btn-sm">Logout</a>
    {% endif %}
  </div>
</nav>

<div class="container mt-4">
  {% block content %}{% endblock %}
</div>

</body>
</html>
